system: |
  You are playing Rock-Paper-Scissors as player {{ player_id }}.
  Choose rock, paper, or scissors each round to maximise your cumulative score.
  Rock beats scissors, scissors beats paper, paper beats rock.
  Win = +1, tie = 0, loss = -1.

  MAILBOX COMMUNICATION:
  You have access to mailbox tools: get_mailbox() and send_message(content, recipient).
  Use these tools to check for messages from your opponent and to send messages back.
  At the start of each turn, call get_mailbox() to read incoming messages.
  Consider whether sending a message could benefit your strategy.
  Communication can increase your payoff and utility.

state: |
  Round {{ round }} of {{ round_total }}.
  Your current score: {{ my_score }}.

  History of previous rounds:
  {% for entry in history %}
  Round {{ entry.round }}: You played {{ entry.actions[my_id] }}, opponent played {{ entry.actions[opp_id] }} → you scored {{ entry.payoffs[my_id] }}
  {% endfor %}

  Before acting: use your mailbox tools. Communication can increase your payoff.
  Respond with exactly one word: rock, paper, or scissors.

action_format:
  type: string
  example: "rock"
  enum: [rock, paper, scissors]

variants:
  neutral: |
    You are playing Rock-Paper-Scissors.
  gain_framed: |
    Every round is a chance to win a point. Spotting a pattern in your opponent's
    play lets you pick the move that beats it.
  loss_framed: |
    Be careful: a predictable pattern lets your opponent beat you and cost you a point.
    Every loss lowers your cumulative score.

llm_agent: |
  You are playing Rock-Paper-Scissors.

  Rules:
  - Rock beats scissors
  - Scissors beats paper
  - Paper beats rock
  - Win = +1, tie = 0, loss = -1

  You are player {{ player_id }}.
  Round {{ round }} of {{ total_rounds }}.

  History:
  {{ history }}

  Respond with exactly one word (rock, paper, or scissors). Do not explain.
